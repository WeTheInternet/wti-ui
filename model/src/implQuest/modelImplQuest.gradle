plugins {
    id	"java-library"
    id	"groovy"
    id	"maven-publish"
}
// GenStart net.wti.gradle.settings.plugin.XapiSettingsPlugin
ext.xapiModern = 'true'
version = '0.51'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
repositories.mavenCentral()
// setup sourcesets

SourceSet main = sourceSets.maybeCreate('main');

SourceSet test = sourceSets.maybeCreate('test');
main.java.setSrcDirs([]);
main.resources.setSrcDirs([]);
test.java.setSrcDirs([]);
test.resources.setSrcDirs([]);
main.java.srcDir("$rootDir/model/src/implQuest/java")
test.groovy.srcDir("$rootDir/model/src/implQuestTest/groovy")
test.resources.srcDir("$rootDir/model/src/implQuestTest/resources")

dependencies {
    implementation project(path: ":model-api")
    implementation project(path: ":model-spi")
    implementation project(path: ":model-time")
    implementation project(path: ":model-inventory")
    implementation project(path: ":model-user")
    testImplementation project(path: ":model-testTools")
    api project(path: ":model-main")
    api project(path: ":model-time")
    testImplementation libs.spock
    testImplementation libs.xapi.model.jre
    implementation libs.xapi.lang.core
    api project(path: ":model-quest")
    api project(path: ":model-implApi")
    api project(path: ":model-implSpi")
    api project(path: ":model-implTime")
    api project(path: ":model-implInventory")
    api project(path: ":model-implUser")
}

repositories {
    maven {
        name = 'xapiLocal'
        url = "/opt/xapi/repo"
    }
}
// Setup publishing to coordinates: net.wti:model-quest-impl
project.extensions.add('xapi.mvn.repo', "/opt/xapi/repo")
Task xapiPublish = tasks.create('xapiPublish')
xapiPublish.group = 'Publishing'
xapiPublish.description = 'Publish jars to xapiLocal repository'
xapiPublish.dependsOn "publishXapiPublicationToXapiLocalRepository"

PublishingExtension ext = extensions.findByName(PublishingExtension.NAME) as PublishingExtension
ext.repositories.maven {
    MavenArtifactRepository repo ->
        repo.name = 'xapiLocal'
        repo.url = "file:///opt/xapi/repo"
}
// not really what we want, but it's good enough for right now
java.withSourcesJar()
java.withJavadocJar()

ext.publications.create("xapi", MavenPublication, {
    pub ->
        afterEvaluate {
            if (tasks.names.contains('shadowJar')) {
                shadow.component(pub)
            } else {
                pub.from(components.named('java').get())
            }
        }
        pub.artifactId = "model-quest-impl"
        pub.groupId = "net.wti"
})
// GenEnd net.wti.gradle.settings.plugin.XapiSettingsPlugin
// Done generating buildfile for :model at file://$rootDir/model/src/implQuest/modelImplQuest.gradle
