plugins {
    // GenInclude plugin from file://$rootDir/model/src/jreQuest/gradle/plugins
    id	"application"
    id	"java-library"
    id	"groovy"
    id	"maven-publish"
}

// GenStart net.wti.gradle.settings.plugin.XapiSettingsPlugin
ext.xapiModern = 'true'
version = '0.51'
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
repositories.mavenCentral()
// setup sourcesets

SourceSet main = sourceSets.maybeCreate('main');

SourceSet test = sourceSets.maybeCreate('test');
main.java.setSrcDirs([]);
main.resources.setSrcDirs([]);
test.java.setSrcDirs([]);
test.resources.setSrcDirs([]);
main.java.srcDir("$rootDir/model/src/jreQuest/java")
test.groovy.srcDir("$rootDir/model/src/jreQuestTest/groovy")

dependencies {
    implementation libs.xapi.model.jre
    testImplementation libs.spock
    testImplementation libs.xapi.model.jre
    api project(path: ":model-implQuest")
    api project(path: ":model-jreApi")
    api project(path: ":model-jreSpi")
    api project(path: ":model-jreTime")
    api project(path: ":model-jreInventory")
    api project(path: ":model-jreUser")
}

repositories {
    maven {
        name = 'xapiLocal'
        url = "/opt/xapi/repo"
    }
}
// Setup publishing to coordinates: net.wti:model-quest-jre
project.extensions.add('xapi.mvn.repo', "/opt/xapi/repo")
Task xapiPublish = tasks.create('xapiPublish')
xapiPublish.group = 'Publishing'
xapiPublish.description = 'Publish jars to xapiLocal repository'
xapiPublish.dependsOn "publishXapiPublicationToXapiLocalRepository"

PublishingExtension ext = extensions.findByName(PublishingExtension.NAME) as PublishingExtension
ext.repositories.maven {
    MavenArtifactRepository repo ->
        repo.name = 'xapiLocal'
        repo.url = "file:///opt/xapi/repo"
}
// not really what we want, but it's good enough for right now
java.withSourcesJar()
java.withJavadocJar()

ext.publications.create("xapi", MavenPublication, {
    pub ->
        afterEvaluate {
            if (tasks.names.contains('shadowJar')) {
                shadow.component(pub)
            } else {
                pub.from(components.named('java').get())
            }
        }
        pub.artifactId = "model-quest-jre"
        pub.groupId = "net.wti"
})
// GenEnd net.wti.gradle.settings.plugin.XapiSettingsPlugin
// GenInclude body.end from file://$rootDir/model/src/jreQuest/gradle/body.end
tasks.register('seedQuestDefinitions', JavaExec) {
    group = 'application'
    description = 'Seeds only missing XApi quest definitions and exports the shared ModelModule.'
    mainClass.set('net.wti.quest.model.jre.QuestDefinitionSeedMain')
    classpath = sourceSets.main.runtimeClasspath
    if (JavaVersion.current().isJava9Compatible()) {
        jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
    }
}

tasks.withType(Test).configureEach {
    dependsOn tasks.named('installDist')
    final File packingFixture = rootProject.file('model/src/implQuestTest/resources/META-INF/models/qdef/packing-checklists.xapi')
    inputs.file(packingFixture)
    systemProperty 'quest.seed.fixture', packingFixture.absolutePath
    doFirst {
        systemProperty 'quest.seed.distribution', tasks.named('installDist').get().destinationDir.absolutePath
    }
}
application {
    mainClass = 'net.wti.quest.model.jre.QuestDefinitionSeedMain'
    applicationName = 'lifequest-quest-seed'
    if (JavaVersion.current().isJava9Compatible()) {
        applicationDefaultJvmArgs = ['--add-opens=java.base/java.lang.invoke=ALL-UNNAMED']
    }
}
// Done generating buildfile for :model at file://$rootDir/model/src/jreQuest/modelJreQuest.gradle
