plugins {
    id	"java-library"
}
// GenStart net.wti.gradle.settings.plugin.XapiSettingsPlugin
ext.xapiModern = 'true'
version = '0.51'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
repositories.mavenCentral()
// setup sourcesets

SourceSet main = sourceSets.maybeCreate('main');

SourceSet test = sourceSets.maybeCreate('test');
main.java.setSrcDirs([]);
main.resources.setSrcDirs([]);
test.java.setSrcDirs([]);
test.resources.setSrcDirs([]);
main.java.srcDir("$rootDir/gdx-themes/src/raeleus-shadeSample/java")

dependencies {
    api project(path: ":gdx-themes-raeleusSample")
    api project(path: ":gdx-themes-raeleus-shade")
}

repositories {
    maven {
        name = 'xapiLocal'
        url = "/opt/xapi/repo"
    }
}
// GenEnd net.wti.gradle.settings.plugin.XapiSettingsPlugin
// GenInclude body.end from file://$rootDir/gdx-themes/src/raeleus-shadeSample/gradle/body.end
tasks.register("runShadeSample", JavaExec) {
    group = "application"
    description = "Run the Shade UI control gallery"
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("com.ray3k.shade.ShadeSample")
}
